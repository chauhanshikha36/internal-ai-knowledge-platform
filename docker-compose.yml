services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: kb
      POSTGRES_PASSWORD: kb
      POSTGRES_DB: kb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kb -d kb"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    image: ai-kb:latest
    environment: &env
      DATABASE_URL: postgresql+psycopg://kb:kb@db:5432/kb
      UPLOAD_DIR: /data/uploads
      API_KEY: ${API_KEY:-}
      RERANK_ENABLED: ${RERANK_ENABLED:-false}
    ports:
      - "8000:8000"
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: .
    image: ai-kb:latest
    command: ["python", "-m", "app.worker"]
    environment: *env
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
